name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-caprae
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caprae
          POSTGRES_PASSWORD: caprae
          POSTGRES_DB: caprae_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caprae" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://caprae:caprae@localhost:5432/caprae_test
      DATABASE_URL: postgresql+psycopg://caprae:caprae@localhost:5432/caprae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head && alembic downgrade base
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-caprae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs-caprae/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
